---
# Default values for uv_install role

# Version and checksum must be updated together.
uv_version: "0.13.5"

# Installation directory (must be world-readable for all users to access uv)
uv_install_dir: "/usr/local/bin"
uv_install_owner: "root"
uv_install_group: "{{ 'wheel' if ansible_facts.os_family == 'Darwin' else 'root' }}"

# Whether to create system-wide symlinks (deprecated, use uv_install_dir instead)
uv_create_symlinks: false

# System-wide symlink location (deprecated, use uv_install_dir instead)
uv_symlink_dir: "/usr/local/bin"

# Whether to update if already installed and a specific version is requested
uv_update_existing: true

# Force reinstallation even if same version exists
uv_force_reinstall: false

uv_checksum:
  # https://github.com/astral-sh/uv/releases/download/0.13.5/uv-x86_64-unknown-linux-gnu.tar.gz.sha256
  x86_64-unknown-linux-gnu: "sha256:f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f"
  # https://github.com/astral-sh/uv/releases/download/0.13.5/uv-aarch64-unknown-linux-gnu.tar.gz.sha256
  aarch64-unknown-linux-gnu: "sha256:4bb69cf95ed13f23713bb7bc09f241896ea0c75b7c557e615a20604b82f9c403"
  # https://github.com/astral-sh/uv/releases/download/0.13.5/uv-x86_64-apple-darwin.tar.gz.sha256
  x86_64-apple-darwin: "sha256:b0f52b0e3945b4107d89024ea38e625683011fbfc05a0d98f9fa2d6dcee28c66"
  # https://github.com/astral-sh/uv/releases/download/0.13.5/uv-aarch64-apple-darwin.tar.gz.sha256
  aarch64-apple-darwin: "sha256:743f85035a1996ecb350659e01cd9faea9709829be09b1b4b03c73eaf3c9cd73"
