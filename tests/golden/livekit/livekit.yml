# Managed by Ansible (livekit_deploy). Do not edit on the host.

http:
  routers:
    livekit:
      rule: "Host(`livekit.example.invalid`)"
      entryPoints:
        - web-secure
      middlewares:
        - livekit-headers
      service: livekit
      tls: {}

  middlewares:
    livekit-headers:
      headers:
        customRequestHeaders:
          X-Forwarded-Proto: https
          X-Forwarded-Host: "livekit.example.invalid"

  services:
    livekit:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:7880"
