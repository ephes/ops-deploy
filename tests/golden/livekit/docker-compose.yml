# Managed by ops-deploy (compose_app). Local changes are overwritten by the next deploy.
name: livekit
services:
  livekit-server:
    image: example.org/livekit/livekit-server:v1.12.0@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    container_name: livekit-server
    command:
    - --config
    - /etc/livekit/livekit.yaml
    network_mode: host
    volumes:
    - type: bind
      source: /etc/livekit/livekit.yaml
      target: /etc/livekit/livekit.yaml
      read_only: true
      bind:
        create_host_path: false
    restart: unless-stopped
  livekit-egress:
    image: example.org/livekit/egress:v1.13.0@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
    container_name: livekit-egress
    network_mode: host
    environment:
      EGRESS_CONFIG_FILE: /etc/egress.yaml
    volumes:
    - type: bind
      source: /etc/livekit/egress.yaml
      target: /etc/egress.yaml
      read_only: true
      bind:
        create_host_path: false
    cap_add:
    - SYS_ADMIN
    shm_size: 1g
    restart: unless-stopped
