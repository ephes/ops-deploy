# Managed by Ansible - Traefik configuration for Vaultwarden
#
# One router. Live sync (/notifications/hub) is served by Vaultwarden on the
# main Rocket port, so it needs no separate router or service; a dedicated
# WebSocket router pointing at the old standalone listener sent live sync to a
# port nothing listens on and answered 502.

http:
  routers:
    # Main Vaultwarden router (HTTPS)
    vaultwarden:
      rule: "Host(`vault.example.net`)"
      entryPoints:
        - websecure
      middlewares:
        - vaultwarden-headers
      service: vaultwarden
      tls: {}

    # HTTP to HTTPS redirect
    vaultwarden-http:
      rule: "Host(`vault.example.net`)"
      entryPoints:
        - web
      middlewares:
        - vaultwarden-redirect
      service: vaultwarden

  middlewares:
    vaultwarden-headers:
      headers:
        browserXssFilter: true
        contentTypeNosniff: true
        forceSTSHeader: true
        stsIncludeSubdomains: true
        stsSeconds: 31536000
        customFrameOptionsValue: SAMEORIGIN
        customRequestHeaders:
          X-Forwarded-Proto: https
          X-Forwarded-Host: "vault.example.net"
          # Deleted: a client must not choose its identity, address or path prefix (ops-deploy _edge.j2).
          Remote-User: ""
          Remote-Email: ""
          Remote-Name: ""
          Remote-Groups: ""
          X-Remote-User: ""
          X-Forwarded-User: ""
          X-Forwarded-Email: ""
          X-Forwarded-Groups: ""
          X-Forwarded-Preferred-Username: ""
          X-Auth-Request-User: ""
          X-Auth-Request-Email: ""
          X-WEBAUTH-USER: ""
          True-Client-IP: ""
          CF-Connecting-IP: ""
          X-Client-IP: ""
          X-Cluster-Client-IP: ""
          Fastly-Client-IP: ""
          X-Original-Forwarded-For: ""
          Forwarded: ""
          X-Forwarded-Prefix: ""
          X-Forwarded-Uri: ""
          X-Forwarded-Method: ""
          X-Forwarded-Ssl: ""
          X-Forwarded-Protocol: ""
          X-Forwarded-Scheme: ""
          X-Url-Scheme: ""
          X-Script-Name: ""
          SCRIPT_NAME: ""
          PATH_INFO: ""

    vaultwarden-redirect:
      redirectScheme:
        scheme: https
        permanent: true

  services:
    vaultwarden:
      loadBalancer:
        servers:
          - url: "http://0.0.0.0:8080"

