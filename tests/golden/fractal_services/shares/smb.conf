# Ansible managed
# Minimal Samba configuration
# Individual shares are included as explicit snippets.

[global]
    workgroup = WORKGROUP
    server string = Samba %h

    # Include this share's snippet
    include = /etc/samba/smb.conf.d/owned0.conf

    security = user
    map to guest = never
    server min protocol = SMB3

    socket options = TCP_NODELAY IPTOS_LOWDELAY
    use sendfile = yes

    load printers = no
    printing = bsd
    printcap name = /dev/null
    disable spoolss = yes

    log file = /var/log/samba/log.%m
    max log size = 1000
    logging = file
