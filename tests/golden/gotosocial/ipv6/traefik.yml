# Managed by Ansible (ops-library gotosocial_deploy) - Traefik route for GoToSocial.
# Public on purpose: federation peers and fediverse clients cannot pass Basic
# Auth. See the role README (exception to the dual-router policy).

http:
  routers:
    gotosocial-secure:
      rule: "Host(`example.org`)"
      entryPoints:
        - websecure
        - web-alt
      middlewares:
        - gotosocial-headers
      service: gotosocial
      tls: {}

    gotosocial-http:
      rule: "Host(`example.org`)"
      entryPoints:
        - http
      middlewares:
        - gotosocial-redirect
      service: gotosocial

  middlewares:
    gotosocial-headers:
      headers:
        contentTypeNosniff: true
        forceSTSHeader: true
        stsIncludeSubdomains: true
        stsSeconds: 15552000
        # GoToSocial sends X-Frame-Options: DENY itself; never weaken it here.
        customFrameOptionsValue: DENY
        customRequestHeaders:
          X-Forwarded-Proto: https
          # Deleted: a client must not choose its identity, address or path prefix (ops-deploy _edge.j2).
          Remote-User: ""
          Remote-Email: ""
          Remote-Name: ""
          Remote-Groups: ""
          X-Remote-User: ""
          X-Forwarded-User: ""
          X-Forwarded-Email: ""
          X-Forwarded-Groups: ""
          X-Forwarded-Preferred-Username: ""
          X-Auth-Request-User: ""
          X-Auth-Request-Email: ""
          X-WEBAUTH-USER: ""
          True-Client-IP: ""
          CF-Connecting-IP: ""
          X-Client-IP: ""
          X-Cluster-Client-IP: ""
          Fastly-Client-IP: ""
          X-Original-Forwarded-For: ""
          Forwarded: ""
          X-Forwarded-Prefix: ""
          X-Forwarded-Uri: ""
          X-Forwarded-Method: ""
          X-Forwarded-Ssl: ""
          X-Forwarded-Protocol: ""
          X-Forwarded-Scheme: ""
          X-Url-Scheme: ""
          X-Script-Name: ""
          SCRIPT_NAME: ""
          PATH_INFO: ""

    gotosocial-redirect:
      redirectScheme:
        scheme: https
        permanent: true

  services:
    gotosocial:
      loadBalancer:
        servers:
          - url: "http://[::1]:18080"
