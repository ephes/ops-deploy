# Managed by Ansible (redis_install role)

port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

bind 127.0.0.1

protected-mode no
daemonize no
supervised systemd
databases 16

requirepass redis-fixture-password

dir /var/lib/redis

maxmemory 256mb
maxmemory-policy allkeys-lru

save ""

appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

loglevel notice
logfile "/var/log/redis/other.log"
stop-writes-on-bgsave-error no
