# Managed by Ansible (redis_install role)

port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

bind 127.0.0.1 ::1

protected-mode yes
daemonize no
supervised systemd
databases 16

# requirepass disabled

dir /var/lib/redis

# maxmemory unlimited

save 900 1
save 300 10
save 60 10000

appendonly no
appendfilename "appendonly.aof"
appendfsync everysec

loglevel notice
logfile "/var/log/redis/redis-server.log"
stop-writes-on-bgsave-error yes
