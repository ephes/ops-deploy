# Managed by Ansible - static site benchmarks-static

http:
  routers:
    benchmarks-static-secure:
      rule: "Host(`static.test.example`)"
      entryPoints:
        - web-secure
      middlewares:
        - benchmarks-static-headers
        - benchmarks-static-compress
      service: benchmarks-static
      tls:
        certResolver: letsencrypt

    benchmarks-static-http:
      rule: "Host(`static.test.example`)"
      entryPoints:
        - web
      middlewares:
        - benchmarks-static-redirect
      service: noop@internal

  middlewares:
    benchmarks-static-headers:
      headers:
        browserXssFilter: true
        contentTypeNosniff: true
        customFrameOptionsValue: SAMEORIGIN
        referrerPolicy: no-referrer
        customRequestHeaders:
          # Deleted: a client must not choose its identity, address or path prefix (ops-deploy _edge.j2).
          Remote-User: ""
          Remote-Email: ""
          Remote-Name: ""
          Remote-Groups: ""
          X-Remote-User: ""
          X-Forwarded-User: ""
          X-Forwarded-Email: ""
          X-Forwarded-Groups: ""
          X-Forwarded-Preferred-Username: ""
          X-Auth-Request-User: ""
          X-Auth-Request-Email: ""
          X-WEBAUTH-USER: ""
          True-Client-IP: ""
          CF-Connecting-IP: ""
          X-Client-IP: ""
          X-Cluster-Client-IP: ""
          Fastly-Client-IP: ""
          X-Original-Forwarded-For: ""
          Forwarded: ""
          X-Forwarded-Prefix: ""
          X-Forwarded-Uri: ""
          X-Forwarded-Method: ""
          X-Forwarded-Ssl: ""
          X-Forwarded-Protocol: ""
          X-Forwarded-Scheme: ""
          X-Url-Scheme: ""
          X-Script-Name: ""
          SCRIPT_NAME: ""
          PATH_INFO: ""
        customResponseHeaders:
          Cache-Control: no-cache

    benchmarks-static-compress:
      compress: {}

    benchmarks-static-redirect:
      redirectScheme:
        scheme: https
        permanent: true

  services:
    benchmarks-static:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: "http://127.0.0.1:10061"
