# Managed by Ansible - Traefik configuration for Zellij private redirect ingress

http:
  routers:
    zellij-secure:
      rule: "Host(`term.example.invalid`) && (ClientIP(`192.0.2.0/24`) || ClientIP(`2001:db8::/32`) || ClientIP(`198.51.100.7/32`))"
      entryPoints:
        - websecure
      middlewares:
        - zellij-redirect-target
      service: noop@internal
      tls:
        certResolver: le_dns

    zellij-http:
      rule: "Host(`term.example.invalid`) && (ClientIP(`192.0.2.0/24`) || ClientIP(`2001:db8::/32`) || ClientIP(`198.51.100.7/32`))"
      entryPoints:
        - web
      middlewares:
        - zellij-redirect-target
      service: noop@internal

  middlewares:
    zellij-redirect-target:
      redirectRegex:
        regex: ".*"
        replacement: "https://Backend.example.invalid"
        permanent: false
