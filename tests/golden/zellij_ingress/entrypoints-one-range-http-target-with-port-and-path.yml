# Managed by Ansible - Traefik configuration for Zellij private redirect ingress

http:
  routers:
    zellij-secure:
      rule: "Host(`zellij.example.invalid`) && (ClientIP(`10.0.0.0/8`))"
      entryPoints:
        - web-secure
        - tailnet_secure
      middlewares:
        - zellij-redirect-target
      service: noop@internal
      tls: {}

    zellij-http:
      rule: "Host(`zellij.example.invalid`) && (ClientIP(`10.0.0.0/8`))"
      entryPoints:
        - web
      middlewares:
        - zellij-redirect-target
      service: noop@internal

  middlewares:
    zellij-redirect-target:
      redirectRegex:
        regex: ".*"
        replacement: "http://backend.example.invalid:8082/web/"
        permanent: false
