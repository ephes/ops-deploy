http:
  routers:
    paperless:
      rule: "Host(`paperless.home.example.test`)"
      service: paperless
      entryPoints:
        - "web-secure"
      tls: {}
      middlewares:
        - paperless-headers

  services:
    paperless:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:10030"
        healthCheck:
          path: /api/
          interval: "30s"
          timeout: "10s"

  middlewares:
    paperless-headers:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        forceSTSHeader: true
        contentTypeNosniff: true
        browserXssFilter: true
        customRequestHeaders:
          X-Forwarded-Proto: "https"
          # Deleted: a client must not choose its identity, address or path prefix (ops-deploy _edge.j2).
          Remote-User: ""
          Remote-Email: ""
          Remote-Name: ""
          Remote-Groups: ""
          X-Remote-User: ""
          X-Forwarded-User: ""
          X-Forwarded-Email: ""
          X-Forwarded-Groups: ""
          X-Forwarded-Preferred-Username: ""
          X-Auth-Request-User: ""
          X-Auth-Request-Email: ""
          X-WEBAUTH-USER: ""
          True-Client-IP: ""
          CF-Connecting-IP: ""
          X-Client-IP: ""
          X-Cluster-Client-IP: ""
          Fastly-Client-IP: ""
          X-Original-Forwarded-For: ""
          Forwarded: ""
          X-Forwarded-Prefix: ""
          X-Forwarded-Uri: ""
          X-Forwarded-Method: ""
          X-Forwarded-Ssl: ""
          X-Forwarded-Protocol: ""
          X-Forwarded-Scheme: ""
          X-Url-Scheme: ""
          X-Script-Name: ""
          SCRIPT_NAME: ""
          PATH_INFO: ""
        customResponseHeaders:
          X-Robots-Tag: "noindex, nofollow"
          server: ""
