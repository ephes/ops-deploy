# Managed by Ansible - Traefik configuration for MeTube

http:
  routers:
    metube-secure:
      rule: "Host(`metube.example.com`)"
      entryPoints:
        - web-secure
      middlewares:
        - metube-headers
        - metube-gzip
      service: metube
      tls: {}

    metube-http:
      rule: "Host(`metube.example.com`)"
      entryPoints:
        - web
      middlewares:
        - metube-redirect
      service: metube

  middlewares:

    metube-headers:
      headers:
        browserXssFilter: true
        contentTypeNosniff: true
        forceSTSHeader: true
        stsIncludeSubdomains: true
        stsSeconds: 15552000
        customFrameOptionsValue: SAMEORIGIN
        customRequestHeaders:
          X-Forwarded-Proto: https
          X-Forwarded-Host: "metube.example.com"
          # Deleted: a client must not choose its identity, address or path prefix (ops-deploy _edge.j2).
          Remote-User: ""
          Remote-Email: ""
          Remote-Name: ""
          Remote-Groups: ""
          X-Remote-User: ""
          X-Forwarded-User: ""
          X-Forwarded-Email: ""
          X-Forwarded-Groups: ""
          X-Forwarded-Preferred-Username: ""
          X-Auth-Request-User: ""
          X-Auth-Request-Email: ""
          X-WEBAUTH-USER: ""
          True-Client-IP: ""
          CF-Connecting-IP: ""
          X-Client-IP: ""
          X-Cluster-Client-IP: ""
          Fastly-Client-IP: ""
          X-Original-Forwarded-For: ""
          Forwarded: ""
          X-Forwarded-Prefix: ""
          X-Forwarded-Uri: ""
          X-Forwarded-Method: ""
          X-Forwarded-Ssl: ""
          X-Forwarded-Protocol: ""
          X-Forwarded-Scheme: ""
          X-Url-Scheme: ""
          X-Script-Name: ""
          SCRIPT_NAME: ""
          PATH_INFO: ""

    metube-gzip:
      compress: {}

    metube-redirect:
      redirectScheme:
        scheme: https
        permanent: true

  services:
    metube:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:8081"
