# Managed by Ansible - Chesslab Traefik configuration

http:
  routers:
    chesslab-int:
      rule: "Host(`chess.example.com`) && (ClientIP(`10.0.0.0/8`))"
      entryPoints:
        - web-secure
      priority: 120
      middlewares:
        - chesslab-headers
        - chesslab-gzip
        - ratelimit@file
        - extra
      service: chesslab
      tls: {}

    chesslab-ext:
      rule: "Host(`chess.example.com`)"
      entryPoints:
        - web-secure
      priority: 100
      middlewares:
        - chesslab-auth
        - chesslab-headers
        - chesslab-gzip
        - ratelimit@file
        - extra
      service: chesslab
      tls: {}

    chesslab-http:
      rule: "Host(`chess.example.com`)"
      entryPoints:
        - web
      middlewares:
        - chesslab-redirect
      service: chesslab

  middlewares:
    chesslab-auth:
      basicAuth:
        users:
          - "admin:$2y$05$29Gfrp5dhiYLdDhT79roVeQM45oGC/gI9VBinrDYyO5ucrXoLooD6"
        removeHeader: true

    chesslab-headers:
      headers:
        browserXssFilter: true
        contentTypeNosniff: true
        forceSTSHeader: true
        stsIncludeSubdomains: true
        stsSeconds: 15552000
        # The backend answers X-Frame-Options: DENY itself. Traefik replaces
        # the backend's header with this value, so it must not be weaker.
        customFrameOptionsValue: DENY
        customRequestHeaders:
          X-Forwarded-Proto: https
          X-Forwarded-Host: "chess.example.com"

    chesslab-gzip:
      compress: {}

    chesslab-redirect:
      redirectScheme:
        scheme: https
        permanent: true

  services:
    chesslab:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:10019"
