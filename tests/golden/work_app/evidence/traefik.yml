# Traefik configuration for the work app
# Managed by Ansible - do not edit manually
# Implements dual router pattern: no auth on LAN/Tailscale, basic auth on public

http:
  routers:
    # INTERNAL router (LAN + Tailscale) - NO auth, higher priority
    work-app-int:
      rule: "Host(`work.home.example.com`) && (ClientIP(`10.0.0.0/8`))"
      entryPoints:
        - web-secure
      priority: 120
      middlewares:
        - work-app-headers
        - work-app-gzip
      service: work-app
      tls: {}

    # EXTERNAL router (Public) - WITH auth, lower priority
    work-app-ext:
      rule: "Host(`work.home.example.com`)"
      entryPoints:
        - web-secure
      priority: 100
      middlewares:
        - work-app-auth
        - work-app-headers
        - work-app-gzip
      service: work-app
      tls: {}

    # HTTP -> HTTPS redirect
    work-app-http:
      rule: "Host(`work.home.example.com`)"
      entryPoints:
        - web
      middlewares:
        - work-app-redirect
      service: work-app

  middlewares:
    work-app-auth:
      basicAuth:
        users:
          - "admin:$2y$05$29Gfrp5dhiYLdDhT79roVeQM45oGC/gI9VBinrDYyO5ucrXoLooD6"
        removeHeader: true

    work-app-headers:
      headers:
        browserXssFilter: true
        contentTypeNosniff: true
        forceSTSHeader: true
        stsIncludeSubdomains: true
        stsSeconds: 15552000
        # The backend answers X-Frame-Options: DENY itself. Traefik replaces
        # the backend's header with this value, so it must not be weaker.
        customFrameOptionsValue: DENY
        customRequestHeaders:
          X-Forwarded-Proto: https
          # Deleted: a client must not choose its identity, address or path prefix (ops-deploy _edge.j2).
          Remote-User: ""
          Remote-Email: ""
          Remote-Name: ""
          Remote-Groups: ""
          X-Remote-User: ""
          X-Forwarded-User: ""
          X-Forwarded-Email: ""
          X-Forwarded-Groups: ""
          X-Forwarded-Preferred-Username: ""
          X-Auth-Request-User: ""
          X-Auth-Request-Email: ""
          X-WEBAUTH-USER: ""
          True-Client-IP: ""
          CF-Connecting-IP: ""
          X-Client-IP: ""
          X-Cluster-Client-IP: ""
          Fastly-Client-IP: ""
          X-Original-Forwarded-For: ""
          Forwarded: ""
          X-Forwarded-Prefix: ""
          X-Forwarded-Uri: ""
          X-Forwarded-Method: ""
          X-Forwarded-Ssl: ""
          X-Forwarded-Protocol: ""
          X-Forwarded-Scheme: ""
          X-Url-Scheme: ""
          X-Script-Name: ""
          SCRIPT_NAME: ""
          PATH_INFO: ""

    work-app-gzip:
      compress: {}

    work-app-redirect:
      redirectScheme:
        scheme: https
        permanent: true

  services:
    work-app:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:10011"
