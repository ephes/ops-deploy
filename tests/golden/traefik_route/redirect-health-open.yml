# Traefik configuration for FastDeploy
# Managed by ops-deploy - do not edit manually

http:
  routers:
    fastdeploy-secure:
      rule: "Host(`app.example.com`)"
      entryPoints:
        - web-secure
      middlewares:
        - fastdeploy-redirect
        - fastdeploy-headers
        - fastdeploy-gzip
      service: fastdeploy
      tls: {}

    # Plain HTTP; the static config redirects the web entrypoint to web-secure.
    fastdeploy-http:
      rule: "Host(`app.example.com`)"
      entryPoints:
        - web
      service: fastdeploy

  middlewares:

    fastdeploy-redirect:
      redirectRegex:
        regex: "^(https?://[^/]+)/$"
        replacement: "${1}/static/index.html"
        permanent: false

    fastdeploy-headers:
      headers:
        browserXssFilter: true
        contentTypeNosniff: true
        forceSTSHeader: true
        stsIncludeSubdomains: true
        stsSeconds: 15552000
        customFrameOptionsValue: SAMEORIGIN
        customRequestHeaders:
          X-Forwarded-Proto: https
          # Deleted: a client must not choose its identity, address or path prefix (ops-deploy _edge.j2).
          Remote-User: ""
          Remote-Email: ""
          Remote-Name: ""
          Remote-Groups: ""
          X-Remote-User: ""
          X-Forwarded-User: ""
          X-Forwarded-Email: ""
          X-Forwarded-Groups: ""
          X-Forwarded-Preferred-Username: ""
          X-Auth-Request-User: ""
          X-Auth-Request-Email: ""
          X-WEBAUTH-USER: ""
          True-Client-IP: ""
          CF-Connecting-IP: ""
          X-Client-IP: ""
          X-Cluster-Client-IP: ""
          Fastly-Client-IP: ""
          X-Original-Forwarded-For: ""
          Forwarded: ""
          X-Forwarded-Prefix: ""
          X-Forwarded-Uri: ""
          X-Forwarded-Method: ""
          X-Forwarded-Ssl: ""
          X-Forwarded-Protocol: ""
          X-Forwarded-Scheme: ""
          X-Url-Scheme: ""
          X-Script-Name: ""
          SCRIPT_NAME: ""
          PATH_INFO: ""

    fastdeploy-gzip:
      compress: {}

  services:
    fastdeploy:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:9999"
        healthCheck:
          path: /
          interval: 30s
          timeout: 3s
