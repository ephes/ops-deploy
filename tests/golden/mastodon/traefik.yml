# Managed by Ansible - Mastodon Traefik config

http:
  routers:
    mastodon-streaming:
      rule: "Host(`social.example.org`) && PathPrefix(`/api/v1/streaming`)"
      entryPoints:
        - web-secure
      service: mastodon-streaming
      priority: 20
      tls: {}
      middlewares:
        - mastodon-edge-headers

    mastodon-web:
      rule: "Host(`social.example.org`)"
      entryPoints:
        - web-secure
      service: mastodon-web
      priority: 10
      tls: {}
      middlewares:
        - mastodon-edge-headers

  middlewares:
    mastodon-edge-headers:
      headers:
        customRequestHeaders:
          # Deleted: a client must not choose its identity, address or path prefix (ops-deploy _edge.j2).
          Remote-User: ""
          Remote-Email: ""
          Remote-Name: ""
          Remote-Groups: ""
          X-Remote-User: ""
          X-Forwarded-User: ""
          X-Forwarded-Email: ""
          X-Forwarded-Groups: ""
          X-Forwarded-Preferred-Username: ""
          X-Auth-Request-User: ""
          X-Auth-Request-Email: ""
          X-WEBAUTH-USER: ""
          True-Client-IP: ""
          CF-Connecting-IP: ""
          X-Client-IP: ""
          X-Cluster-Client-IP: ""
          Fastly-Client-IP: ""
          X-Original-Forwarded-For: ""
          Forwarded: ""
          X-Forwarded-Prefix: ""
          X-Forwarded-Uri: ""
          X-Forwarded-Method: ""
          X-Forwarded-Ssl: ""
          X-Forwarded-Protocol: ""
          X-Forwarded-Scheme: ""
          X-Url-Scheme: ""
          X-Script-Name: ""
          SCRIPT_NAME: ""
          PATH_INFO: ""

  services:
    mastodon-web:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:10044"

    mastodon-streaming:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:10044"
