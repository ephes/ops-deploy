# Managed by Ansible - Traefik configuration for OpsGate private ingress

http:
  routers:
    opsgate-secure:
      rule: "Host(`opsgate.example.invalid`) && (ClientIP(`127.0.0.1/32`) || ClientIP(`::1/128`) || ClientIP(`100.64.0.0/10`) || ClientIP(`fd7a:115c:a1e0::/48`))"
      entryPoints:
        - web-secure
      middlewares:
        - opsgate-headers
        - opsgate-gzip
      service: opsgate
      tls:
        certResolver: letsencrypt

    opsgate-http:
      rule: "Host(`opsgate.example.invalid`) && (ClientIP(`127.0.0.1/32`) || ClientIP(`::1/128`) || ClientIP(`100.64.0.0/10`) || ClientIP(`fd7a:115c:a1e0::/48`))"
      entryPoints:
        - web
      middlewares:
        - opsgate-redirect
      service: opsgate

  middlewares:
    opsgate-headers:
      headers:
        browserXssFilter: true
        contentTypeNosniff: true
        forceSTSHeader: true
        stsIncludeSubdomains: true
        stsSeconds: 15552000
        customFrameOptionsValue: SAMEORIGIN
        customRequestHeaders:
          X-Forwarded-Proto: https
          X-Forwarded-Host: "opsgate.example.invalid"
          # Deleted: a client must not choose its identity, address or path prefix (ops-deploy _edge.j2).
          Remote-User: ""
          Remote-Email: ""
          Remote-Name: ""
          Remote-Groups: ""
          X-Remote-User: ""
          X-Forwarded-User: ""
          X-Forwarded-Email: ""
          X-Forwarded-Groups: ""
          X-Forwarded-Preferred-Username: ""
          X-Auth-Request-User: ""
          X-Auth-Request-Email: ""
          X-WEBAUTH-USER: ""
          True-Client-IP: ""
          CF-Connecting-IP: ""
          X-Client-IP: ""
          X-Cluster-Client-IP: ""
          Fastly-Client-IP: ""
          X-Original-Forwarded-For: ""
          Forwarded: ""
          X-Forwarded-Prefix: ""
          X-Forwarded-Uri: ""
          X-Forwarded-Method: ""
          X-Forwarded-Ssl: ""
          X-Forwarded-Protocol: ""
          X-Forwarded-Scheme: ""
          X-Url-Scheme: ""
          X-Script-Name: ""
          SCRIPT_NAME: ""
          PATH_INFO: ""

    opsgate-gzip:
      compress: {}

    opsgate-redirect:
      redirectScheme:
        scheme: https
        permanent: true

  services:
    opsgate:
      loadBalancer:
        servers:
          - url: "http://backend.invalid:8787"
