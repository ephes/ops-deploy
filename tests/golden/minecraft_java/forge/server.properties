# Minecraft server.properties
# Generated by Ansible - minecraft_java_deploy role
# Manual changes will be overwritten on next deployment

# Server Settings
server-port=25565
max-players=20
motd=A Minecraft Server
level-name=world

level-type=minecraft:normal

# Gameplay
difficulty=normal
gamemode=survival
pvp=true
allow-flight=false
allow-nether=true
generate-structures=true
spawn-protection=16
max-world-size=29999984

# Performance
view-distance=10
simulation-distance=10
max-tick-time=60000
network-compression-threshold=256

# Security
online-mode=true
white-list=false
enforce-whitelist=false
enforce-secure-profile=true

# RCON (for backup coordination)
enable-rcon=true
rcon.port=25575
rcon.password=fixture-rcon-password
broadcast-rcon-to-ops=false

# Query (disabled for security)
enable-query=false

# JMX (disabled)
enable-jmx-monitoring=false

# Other defaults
spawn-npcs=true
spawn-animals=true
spawn-monsters=true
enable-command-block=false
op-permission-level=4
function-permission-level=2
player-idle-timeout=0
rate-limit=0
previews-chat=false
hide-online-players=false
sync-chunk-writes=true
use-native-transport=true
