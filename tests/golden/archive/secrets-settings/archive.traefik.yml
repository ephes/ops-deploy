# Managed by Ansible - Archive Traefik configuration

http:
  routers:
    archive-secure:
      rule: "Host(`archive.home.example.invalid`)"
      entryPoints:
        - web-secure
      middlewares:
        - archive-headers
      service: archive
      tls: {}

    archive-http:
      rule: "Host(`archive.home.example.invalid`)"
      entryPoints:
        - web
      middlewares:
        - archive-redirect
      service: archive

  middlewares:
    archive-headers:
      headers:
        browserXssFilter: true
        contentTypeNosniff: true
        forceSTSHeader: true
        stsIncludeSubdomains: true
        stsSeconds: 15552000
        # The backend answers X-Frame-Options: DENY itself. Traefik replaces
        # the backend's header with this value, so it must not be weaker.
        customFrameOptionsValue: DENY
        customRequestHeaders:
          X-Forwarded-Proto: https
          X-Forwarded-Host: "archive.home.example.invalid"
          # Deleted: a client must not choose its identity, address or path prefix (ops-deploy _edge.j2).
          Remote-User: ""
          Remote-Email: ""
          Remote-Name: ""
          Remote-Groups: ""
          X-Remote-User: ""
          X-Forwarded-User: ""
          X-Forwarded-Email: ""
          X-Forwarded-Groups: ""
          X-Forwarded-Preferred-Username: ""
          X-Auth-Request-User: ""
          X-Auth-Request-Email: ""
          X-WEBAUTH-USER: ""
          True-Client-IP: ""
          CF-Connecting-IP: ""
          X-Client-IP: ""
          X-Cluster-Client-IP: ""
          Fastly-Client-IP: ""
          X-Original-Forwarded-For: ""
          Forwarded: ""
          X-Forwarded-Prefix: ""
          X-Forwarded-Uri: ""
          X-Forwarded-Method: ""
          X-Forwarded-Ssl: ""
          X-Forwarded-Protocol: ""
          X-Forwarded-Scheme: ""
          X-Url-Scheme: ""
          X-Script-Name: ""
          SCRIPT_NAME: ""
          PATH_INFO: ""

    archive-redirect:
      redirectScheme:
        scheme: https
        permanent: true

  services:
    archive:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:10041"
