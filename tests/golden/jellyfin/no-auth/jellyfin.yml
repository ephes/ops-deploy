# Managed by Ansible - Traefik configuration for Jellyfin

http:
  routers:
    jellyfin-secure:
      rule: "Host(`media.example.com`)"
      entryPoints:
        - web-secure
      middlewares:
        - jellyfin-headers
        - jellyfin-gzip
        - extra
      service: jellyfin
      tls:
        certResolver: le

    jellyfin-http:
      rule: "Host(`media.example.com`)"
      entryPoints:
        - web
      middlewares:
        - jellyfin-redirect
      service: jellyfin

  middlewares:

    jellyfin-headers:
      headers:
        browserXssFilter: true
        contentTypeNosniff: true
        forceSTSHeader: true
        stsIncludeSubdomains: true
        stsSeconds: 15552000
        customFrameOptionsValue: SAMEORIGIN
        customRequestHeaders:
          X-Forwarded-Proto: https
          X-Forwarded-Host: "media.example.com"

    jellyfin-gzip:
      compress: {}

    jellyfin-redirect:
      redirectScheme:
        scheme: https
        permanent: true

  services:
    jellyfin:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:8096"
