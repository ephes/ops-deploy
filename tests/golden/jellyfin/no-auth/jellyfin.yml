# Managed by Ansible - Traefik configuration for Jellyfin

http:
  routers:
    jellyfin-secure:
      rule: "Host(`media.example.com`)"
      entryPoints:
        - web-secure
      middlewares:
        - jellyfin-headers
        - jellyfin-gzip
        - extra
      service: jellyfin
      tls:
        certResolver: le

    jellyfin-http:
      rule: "Host(`media.example.com`)"
      entryPoints:
        - web
      middlewares:
        - jellyfin-redirect
      service: jellyfin

  middlewares:

    jellyfin-headers:
      headers:
        browserXssFilter: true
        contentTypeNosniff: true
        forceSTSHeader: true
        stsIncludeSubdomains: true
        stsSeconds: 15552000
        customFrameOptionsValue: SAMEORIGIN
        customRequestHeaders:
          X-Forwarded-Proto: https
          X-Forwarded-Host: "media.example.com"
          # Deleted: a client must not choose its identity, address or path prefix (ops-deploy _edge.j2).
          Remote-User: ""
          Remote-Email: ""
          Remote-Name: ""
          Remote-Groups: ""
          X-Remote-User: ""
          X-Forwarded-User: ""
          X-Forwarded-Email: ""
          X-Forwarded-Groups: ""
          X-Forwarded-Preferred-Username: ""
          X-Auth-Request-User: ""
          X-Auth-Request-Email: ""
          X-WEBAUTH-USER: ""
          True-Client-IP: ""
          CF-Connecting-IP: ""
          X-Client-IP: ""
          X-Cluster-Client-IP: ""
          Fastly-Client-IP: ""
          X-Original-Forwarded-For: ""
          Forwarded: ""
          X-Forwarded-Prefix: ""
          X-Forwarded-Uri: ""
          X-Forwarded-Method: ""
          X-Forwarded-Ssl: ""
          X-Forwarded-Protocol: ""
          X-Forwarded-Scheme: ""
          X-Url-Scheme: ""
          X-Script-Name: ""
          SCRIPT_NAME: ""
          PATH_INFO: ""

    jellyfin-gzip:
      compress: {}

    jellyfin-redirect:
      redirectScheme:
        scheme: https
        permanent: true

  services:
    jellyfin:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:8096"
