http:
  routers:
    homeassistant:
      rule: "Host(`homeassistant.owned.example`)"
      service: homeassistant
      tls: {}
      middlewares:
        - homeassistant-headers
        - second
        - first
      entryPoints:
        - owned-one
        - owned-two

    # Local access without HTTPS
    homeassistant-local:
      rule: "Host(`homeassistant.local`) || Host(`192.0.2.11`)"
      service: homeassistant
      middlewares:
      entryPoints:
        - web

  services:
    homeassistant:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:8321"

  middlewares:
    homeassistant-headers:
      headers:
        browserXssFilter: true
        contentTypeNosniff: true
        forceSTSHeader: true
        stsIncludeSubdomains: true
        stsSeconds: 15552000
        customFrameOptionsValue: SAMEORIGIN
        customRequestHeaders:
          X-Forwarded-Proto: https
          X-Forwarded-Host: "homeassistant.owned.example"
          # Deleted: a client must not choose its identity, address or path prefix (ops-deploy _edge.j2).
          Remote-User: ""
          Remote-Email: ""
          Remote-Name: ""
          Remote-Groups: ""
          X-Remote-User: ""
          X-Forwarded-User: ""
          X-Forwarded-Email: ""
          X-Forwarded-Groups: ""
          X-Forwarded-Preferred-Username: ""
          X-Auth-Request-User: ""
          X-Auth-Request-Email: ""
          X-WEBAUTH-USER: ""
          True-Client-IP: ""
          CF-Connecting-IP: ""
          X-Client-IP: ""
          X-Cluster-Client-IP: ""
          Fastly-Client-IP: ""
          X-Original-Forwarded-For: ""
          Forwarded: ""
          X-Forwarded-Prefix: ""
          X-Forwarded-Uri: ""
          X-Forwarded-Method: ""
          X-Forwarded-Ssl: ""
          X-Forwarded-Protocol: ""
          X-Forwarded-Scheme: ""
          X-Url-Scheme: ""
          X-Script-Name: ""
          SCRIPT_NAME: ""
          PATH_INFO: ""
    homeassistant-websocket:
      headers:
        customRequestHeaders:
          Connection: Upgrade
          Upgrade: websocket
