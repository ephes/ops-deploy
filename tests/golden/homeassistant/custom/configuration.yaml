# Home Assistant Configuration
# Generated by Ansible deployment

# Basic configuration
homeassistant:
  name: Home Assistant
  latitude: 51.2
  longitude: -1.4
  elevation: 23
  unit_system: metric
  time_zone: UTC
  country: DE
  currency: EUR
  external_url: https://ha.example.test
  internal_url: http://owned:8123
  
# HTTP configuration for reverse proxy
http:
  server_host: 0.0.0.0
  server_port: 10020
  use_x_forwarded_for: true
  trusted_proxies:
    - 192.0.2.3
  ip_ban_enabled: true
  login_attempts_threshold: 5

# Database configuration
recorder:
  db_url: postgresql://owned:synthetic@localhost/fixture
  purge_keep_days: 10
  commit_interval: 5
  exclude:
    domains:
      - automation
      - updater
    entity_globs:
      - sensor.weather_*
    entities:
      - sun.sun
      - sensor.date

# Logger configuration
logger:
  default: warning
  logs:
    owned.second: error
    owned.first: debug

# Enable the frontend
frontend:
  themes: !include_dir_merge_named themes

# Enable configuration UI
config:

# System Health
system_health:

# Lovelace UI
lovelace:
  mode: storage
  dashboards:
    lovelace-generated:
      mode: yaml
      filename: notexist.yaml
      title: Generated
      icon: mdi:tools
      show_in_sidebar: true
      require_admin: true

# Mobile app support
mobile_app:

# Person tracking
person:

# Sun tracking
sun:

# Enable support for tracking state changes
history:

# Enable logging of events
logbook:

# Text to speech
tts:
  - platform: google_translate

# Cloud (optional - comment out if not using Home Assistant Cloud)
# cloud:

# Automations (stored in automations.yaml)
automation: !include automations.yaml

# Scripts (stored in scripts.yaml)
script: !include scripts.yaml

# Scenes (stored in scenes.yaml)
scene: !include scenes.yaml

# Groups (stored in groups.yaml)
group: !include groups.yaml

# Zones
zone:
  - name: Home
    latitude: 51.2
    longitude: -1.4
    radius: 100
    icon: mdi:home

# Default integrations
default_config:

# MQTT (optional - uncomment if you have an MQTT broker)
# mqtt:
#   broker: 127.0.0.1
#   port: 1883
#   username: homeassistant
#   password: !secret mqtt_password

# Z-Wave (optional - uncomment if you have Z-Wave devices)
# zwave:
#   usb_path: /dev/ttyUSB0

# Zigbee (optional - uncomment if you have Zigbee devices)
# zha:
#   usb_path: /dev/ttyUSB1
#   database_path: /srv/owned-data/zigbee.db

# UniFi Network Integration 
# NOTE: UniFi must be configured through the UI, not YAML
# Go to Settings → Devices & Services → Add Integration → UniFi Network
# Use these credentials:
#   Host: 192.0.2.94
#   Port: 8443
#   Username: homeassistant
#   Password: (from secrets.yaml unifi_password)
#   Site: default
