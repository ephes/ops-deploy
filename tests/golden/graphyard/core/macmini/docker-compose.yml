services:
  influxdb:
    image: "influxdb:2.7"
    container_name: "graphyard-influxdb"
    restart: unless-stopped
    ports:
      - "127.0.0.1:8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: "setup"
      DOCKER_INFLUXDB_INIT_USERNAME: "graphyard_admin"
      DOCKER_INFLUXDB_INIT_PASSWORD: "graphyard-fixture-influx-token"
      DOCKER_INFLUXDB_INIT_ORG: "graphyard"
      DOCKER_INFLUXDB_INIT_BUCKET: "graphyard"
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: "graphyard-fixture-influx-token"
    volumes:
      - "/var/lib/graphyard/influxdb2:/var/lib/influxdb2"
      - "/var/lib/graphyard/influxdb2-config:/etc/influxdb2"
    # The host journal (CONTAINER_NAME), which Logyard's Vector ships.
    logging:
      driver: journald
      options:
        tag: "graphyard-influxdb"
    networks:
      - monitoring

  grafana:
    image: "grafana/grafana-oss:12.4.0@sha256:b0ae311af06228bcfd4a620504b653db80f5b91e94dc3dc2a5b7dab202bcde20"
    container_name: "graphyard-grafana"
    restart: unless-stopped
    ports:
      - "127.0.0.1:3300:3000"
    environment:
      GF_SECURITY_ADMIN_USER: "admin"
      GF_SECURITY_ADMIN_PASSWORD: "graphyard-fixture-grafana-admin"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: "/etc/grafana/provisioning/dashboards-json/overview/graphyard-home.json"
      GRAPHYARD_INFLUX_DB: "graphyard"
      GRAPHYARD_INFLUX_USER: "grafana"
      GRAPHYARD_INFLUX_PASSWORD: "graphyard-fixture-grafana-influx"
    env_file:
      # GRAPHYARD_INFLUX_FLUX_TOKEN for the Flux datasource; written by the deploy.
      - path: "/etc/graphyard/grafana-flux.env"
        required: false
    volumes:
      - "/opt/apps/graphyard/site/deploy/grafana/provisioning:/etc/grafana/provisioning"
      - "/opt/apps/graphyard/site/deploy/grafana/dashboards:/etc/grafana/provisioning/dashboards-json"
      - "/var/lib/graphyard/grafana:/var/lib/grafana"
    logging:
      driver: journald
      options:
        tag: "graphyard-grafana"
    networks:
      - monitoring

networks:
  monitoring:
    external: true
    name: "graphyard-monitoring"
