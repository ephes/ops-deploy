# Managed by Ansible - weeknotes.home Traefik configuration

http:
  routers:
    weeknotes-home-int:
      rule: "Host(`weeknotes.home.example.com`) && (ClientIP(`192.168.0.0/16`) || ClientIP(`10.0.0.0/8`) || ClientIP(`172.16.0.0/12`) || ClientIP(`100.64.0.0/10`) || ClientIP(`fd7a:115c:a1e0::/48`))"
      entryPoints:
        - web-secure
      priority: 120
      middlewares:
        - weeknotes-home-headers
        - weeknotes-home-gzip
      service: weeknotes-home
      tls: {}

    weeknotes-home-ext:
      rule: "Host(`weeknotes.home.example.com`)"
      entryPoints:
        - web-secure
      priority: 100
      middlewares:
        - weeknotes-home-auth
        - weeknotes-home-headers
        - weeknotes-home-gzip
      service: weeknotes-home
      tls: {}

    weeknotes-home-http:
      rule: "Host(`weeknotes.home.example.com`)"
      entryPoints:
        - web
      middlewares:
        - weeknotes-home-redirect
      service: noop@internal

  middlewares:
    weeknotes-home-auth:
      basicAuth:
        users:
          - "admin:$2y$05$29Gfrp5dhiYLdDhT79roVeQM45oGC/gI9VBinrDYyO5ucrXoLooD6"
        removeHeader: True

    weeknotes-home-headers:
      headers:
        browserXssFilter: true
        contentTypeNosniff: true
        # The backend answers X-Frame-Options: DENY itself. Traefik replaces
        # the backend's header with this value, so it must not be weaker.
        customFrameOptionsValue: DENY
        customRequestHeaders:
          X-Forwarded-Proto: https
          X-Forwarded-Host: "weeknotes.home.example.com"
          # Deleted: a client must not choose its identity, address or path prefix (ops-deploy _edge.j2).
          Remote-User: ""
          Remote-Email: ""
          Remote-Name: ""
          Remote-Groups: ""
          X-Remote-User: ""
          X-Forwarded-User: ""
          X-Forwarded-Email: ""
          X-Forwarded-Groups: ""
          X-Forwarded-Preferred-Username: ""
          X-Auth-Request-User: ""
          X-Auth-Request-Email: ""
          X-WEBAUTH-USER: ""
          True-Client-IP: ""
          CF-Connecting-IP: ""
          X-Client-IP: ""
          X-Cluster-Client-IP: ""
          Fastly-Client-IP: ""
          X-Original-Forwarded-For: ""
          Forwarded: ""
          X-Forwarded-Prefix: ""
          X-Forwarded-Uri: ""
          X-Forwarded-Method: ""
          X-Forwarded-Ssl: ""
          X-Forwarded-Protocol: ""
          X-Forwarded-Scheme: ""
          X-Url-Scheme: ""
          X-Script-Name: ""
          SCRIPT_NAME: ""
          PATH_INFO: ""

    weeknotes-home-gzip:
      compress: {}

    weeknotes-home-redirect:
      redirectScheme:
        scheme: https
        permanent: true

  services:
    weeknotes-home:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:10062"
