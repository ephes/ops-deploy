# Managed by Ansible (ops-library journald_config role). Do not edit by hand.
#
# Effective configuration across all files:
#   systemd-analyze cat-config systemd/journald.conf
[Journal]
Storage=volatile
SystemMaxUse=1.5G
SystemKeepFree=2G
SystemMaxFileSize=64M
SystemMaxFiles=0
MaxRetentionSec=1.5day
MaxFileSec=1w 2d12h
Compress=yes
Seal=no
RateLimitBurst=20000
RateLimitIntervalSec=30s
