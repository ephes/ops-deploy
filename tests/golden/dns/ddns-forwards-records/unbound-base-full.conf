# Unbound base configuration - Full DNS server mode
# This configuration is used when dns_mode == 'unbound_only'

server:
    # Network interfaces - listen on all for both LAN and Tailscale
    interface: 0.0.0.0
    interface: ::0
    # Explicitly bind to Tailscale IP if available
    interface: 100.64.0.1
    port: 53

    # Automatically select correct interface for replies
    interface-automatic: yes

    # Access control
    access-control: 127.0.0.0/8 allow
    access-control: ::1/128 allow
    access-control: 192.0.2.0/24 allow
    access-control: 100.64.0.0/10 allow
    access-control: 0.0.0.0/0 refuse
    access-control: ::/0 refuse

    # Performance
    num-threads: 4
    cache-min-ttl: 3600
    cache-max-ttl: 86400
    cache-max-negative-ttl: 3600
    msg-cache-size: 128m
    rrset-cache-size: 256m
    prefetch: no
    prefetch-key: no

    # Security
    hide-identity: yes
    hide-version: yes
    harden-glue: yes
    harden-dnssec-stripped: yes
    harden-referral-path: yes
    use-caps-for-id: yes

    # DNSSEC
    # auto-trust-anchor-file is already defined in root-auto-trust-anchor-file.conf
    val-clean-additional: yes
    val-permissive-mode: no
    val-log-level: 1

    # Logging
    verbosity: 1
    log-queries: no
    log-replies: no
    log-servfail: yes

    # IPv6
    do-ip6: yes
    prefer-ip6: no

    # TCP
    do-tcp: yes
    tcp-idle-timeout: 900000

    # Files
    directory: "/etc/unbound"
    logfile: ""  # Log to syslog
    pidfile: "/run/unbound.pid"

    # Include blocklist if it exists
    include: "/var/lib/unbound/blocklist.conf"

    # Include allowlist overrides if they exist
    include: "/var/lib/unbound/allowlist.conf"
