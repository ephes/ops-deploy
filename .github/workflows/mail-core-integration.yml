name: Mail core native integration

on:
  pull_request:
    paths:
      - '.github/workflows/mail-core-integration.yml'
      - 'src/ops_deploy/services/_mail_config/**'
      - 'src/ops_deploy/services/_mail_database/**'
      - 'src/ops_deploy/services/_mail_postfix/**'
      - 'src/ops_deploy/services/mail_backend/**'
      - 'src/ops_deploy/services/mail_relay/**'
      - 'src/ops_deploy/services/mail_spam/**'
      - 'tests/integration/mail_core/**'
  workflow_dispatch:
    inputs:
      implementation_sha:
        description: Exact reviewed ops-deploy implementation commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mail-core-integration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-x86-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Validate immutable implementation selection
        env:
          IMPLEMENTATION_SHA: ${{ github.event.pull_request.head.sha || inputs.implementation_sha }}
        run: '[[ "$IMPLEMENTATION_SHA" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.implementation_sha }}
          path: .implementation
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          python-version: '3.13'
          enable-cache: false
      - name: Install locked controller with the immutable implementation
        working-directory: .implementation
        env:
          IMPLEMENTATION_SHA: ${{ github.event.pull_request.head.sha || inputs.implementation_sha }}
        run: |
          unset OPS_DEPLOY_PATH OPS_LIBRARY_PATH VIRTUAL_ENV
          uv sync --locked
          uv pip install --python .venv/bin/python --no-deps --reinstall "ops-deploy @ git+https://github.com/ephes/ops-deploy.git@$IMPLEMENTATION_SHA"
      - name: Package-absent backend/edge install, package fault, fresh install and repeat
        env:
          IMPLEMENTATION_SHA: ${{ github.event.pull_request.head.sha || inputs.implementation_sha }}
        run: |
          sudo env GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted GITHUB_RUN_ID="$GITHUB_RUN_ID" \
            IMPLEMENTATION_SHA="$IMPLEMENTATION_SHA" HARNESS_SHA="$(git rev-parse HEAD)" \
            CONTROLLER_PYTHON="$PWD/.implementation/.venv/bin/python" \
            bash tests/integration/mail_core/run.sh
      - name: Capture fixture diagnostics
        if: always()
        run: |
          sudo mkdir -p /var/tmp/mail-core-evidence
          # Once the harness started (per-run credentials exist) it captures and
          # scans the guest journals itself; never copy them unscanned.
          if sudo test -e /var/tmp/mail-core-evidence/harness-started; then
            sudo chmod -R a+rX /var/tmp/mail-core-evidence
            exit 0
          fi
          for machine in mc-backend mc-edge; do
            sudo journalctl -M "$machine" --no-pager -n 400 > "/tmp/$machine-journal.txt" 2>&1 \
              || echo "journal for $machine unavailable"
            sudo cp "/tmp/$machine-journal.txt" "/var/tmp/mail-core-evidence/$machine-journal.log" || true
          done
          sudo chmod -R a+rX /var/tmp/mail-core-evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: mail-core-native-${{ github.run_id }}
          path: /var/tmp/mail-core-evidence
          if-no-files-found: error
          retention-days: 7
