name: Daybook attention reader native

on:
  push:
    branches: [pyinfra-attention-reader-20261031]
    paths:
      - '.github/workflows/daybook-attention-reader-native.yml'
      - 'tests/integration/daybook_attention_reader/**'
      - 'src/ops_deploy/**'
      - 'pyproject.toml'
      - 'uv.lock'
  workflow_dispatch:
    inputs:
      implementation_sha:
        description: Exact reviewed ops-deploy implementation commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: daybook-attention-reader-native-${{ github.ref }}
  cancel-in-progress: false

jobs:
  owned-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      IMPLEMENTATION_SHA: ${{ inputs.implementation_sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.IMPLEMENTATION_SHA }}
          persist-credentials: false
      - name: Validate immutable implementation selection
        run: '[[ "$IMPLEMENTATION_SHA" =~ ^[0-9a-f]{40}$ ]]'
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          python-version: '3.13'
          enable-cache: false
      - name: Install immutable controller
        run: |
          unset OPS_DEPLOY_PATH OPS_LIBRARY_PATH VIRTUAL_ENV
          uv sync --locked --no-dev
          uv pip install --python .venv/bin/python --no-deps --reinstall "ops-deploy @ git+https://github.com/ephes/ops-deploy.git@$IMPLEMENTATION_SHA"
      - name: Run original helper on disposable Linux with synthetic IAM
        run: |
          sudo env GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted GITHUB_RUN_ID="$GITHUB_RUN_ID" \
            IMPLEMENTATION_SHA="$IMPLEMENTATION_SHA" \
            "$PWD/.venv/bin/python" tests/integration/daybook_attention_reader/harness.py
      - name: Make owned evidence readable
        if: always()
        run: sudo chmod -R a+rX /var/tmp/daybook-attention-reader-evidence || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: daybook-attention-reader-${{ github.run_id }}
          path: /var/tmp/daybook-attention-reader-evidence
          if-no-files-found: error
          retention-days: 7
