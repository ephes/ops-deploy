name: Native host baseline integration

on:
  pull_request:
    paths:
      - '.github/workflows/host-exceptions-native.yml'
      - 'src/ops_deploy/base/hostname.py'
      - 'src/ops_deploy/services/graphyard/vector*'
      - 'src/ops_deploy/services/graphyard/_common.py'
      - 'src/ops_deploy/services/graphyard/files/graphyard_vector_host.py'
      - 'src/ops_deploy/services/graphyard/templates/vector.*'
      - 'src/ops_deploy/services/logyard/vector.py'
      - 'src/ops_deploy/ops/secret_file.py'
      - 'src/ops_deploy/testing/**'
      - 'smoke/host_exceptions_macos_fixture.py'
      - 'smoke/ollama_macos_fixture.py'
      - 'tests/test_graphyard_darwin.py'
  workflow_dispatch:
    inputs:
      implementation_sha:
        description: Exact reviewed ops-deploy implementation commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: native-host-baseline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-macos:
    runs-on: macos-15
    timeout-minutes: 40
    env:
      IMPLEMENTATION_SHA: ${{ inputs.implementation_sha || github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validate immutable implementation selection
        run: '[[ "$IMPLEMENTATION_SHA" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.IMPLEMENTATION_SHA }}
          path: .implementation
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          python-version: '3.13'
          enable-cache: false
      - name: Build and install immutable implementation package
        working-directory: .implementation
        run: |
          uv build --wheel
          uv venv --python 3.13 /private/var/tmp/baseline-controller
          uv pip install --python /private/var/tmp/baseline-controller/bin/python dist/*.whl
      - name: Qualify native hostname and real Vector package/service/config/fault/repeat
        id: native_fixture
        run: |
          sudo env GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted GITHUB_RUN_ID="$GITHUB_RUN_ID" \
            IMPLEMENTATION_SHA="$IMPLEMENTATION_SHA" FIXTURE_BREW_BIN="$(command -v brew)" \
            BASELINE_EVIDENCE_DIR=/private/var/tmp/baseline-evidence \
            /private/var/tmp/baseline-controller/bin/python .implementation/smoke/host_exceptions_macos_fixture.py
      - name: Diagnose owned runner Homebrew after failed fixture cleanup
        if: failure() && steps.native_fixture.outcome == 'failure'
        continue-on-error: true
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_ANALYTICS: '1'
        run: |
          # Public package diagnostics only; the original fixture stays failed.
          # No environment dump, private config, token or install-proof claim.
          brew config
          brew tap vectordotdev/brew
          brew install vector
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-host-baseline-${{ github.run_id }}
          path: /private/var/tmp/baseline-evidence
          if-no-files-found: error
          retention-days: 7
