name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - uses: extractions/setup-just@v3
      # fish: tests/test_remote_shell_execution.py runs commands through it (root's login shell on the hosts).
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fish
      - run: uv sync --locked
      - run: just lint
      - run: just typecheck
      - run: just test
      - run: just size-cap
      - run: just docs
