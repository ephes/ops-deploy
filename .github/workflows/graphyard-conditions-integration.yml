name: Graphyard conditions integration

# Owned disposable GitHub-hosted Ubuntu VM, synthetic condition rows only.
on:
  push:
    branches:
      - pyinfra-graphyard-conditions-20261027
    paths:
      - '.github/workflows/graphyard-conditions-integration.yml'
      - 'tests/integration/graphyard_conditions/**'
      - 'src/ops_deploy/services/graphyard/**'
  workflow_dispatch:
    inputs:
      implementation_sha:
        description: Exact reviewed ops-deploy implementation commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: graphyard-conditions-integration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  real-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      IMPLEMENTATION_SHA: ${{ inputs.implementation_sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate immutable implementation selection
        run: '[[ "$IMPLEMENTATION_SHA" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.IMPLEMENTATION_SHA }}
          path: .implementation
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          python-version: '3.13'
          enable-cache: false
      - name: Install the locked controller with the immutable Git package
        working-directory: .implementation
        run: |
          unset OPS_DEPLOY_PATH OPS_LIBRARY_PATH VIRTUAL_ENV
          uv sync --locked --no-dev
          uv pip install --python .venv/bin/python --no-deps --reinstall "ops-deploy @ git+https://github.com/ephes/ops-deploy.git@$IMPLEMENTATION_SHA"
      - name: Owned Graphyard conditions qualification
        run: |
          sudo env GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted GITHUB_RUN_ID="$GITHUB_RUN_ID" \
            IMPLEMENTATION_SHA="$IMPLEMENTATION_SHA" HARNESS_SHA="$GITHUB_SHA" UV_BIN="$(command -v uv)" \
            CONTROLLER_PYTHON="$PWD/.implementation/.venv/bin/python" \
            bash tests/integration/graphyard_conditions/run.sh
      - name: Make fixture evidence readable
        if: always()
        run: sudo chmod -R a+rX /var/tmp/graphyard-conditions-evidence || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: graphyard-conditions-${{ github.run_id }}
          path: /var/tmp/graphyard-conditions-evidence
          if-no-files-found: error
          retention-days: 7
