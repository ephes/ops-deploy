name: Mastodon release integration

on:
  workflow_dispatch:
    inputs:
      implementation_sha:
        description: Exact reviewed ops-deploy release implementation commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mastodon-release-integration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  real-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate immutable implementation selection
        env:
          IMPLEMENTATION_SHA: ${{ inputs.implementation_sha }}
        run: |
          [[ "$IMPLEMENTATION_SHA" =~ ^[0-9a-f]{40}$ ]]
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.implementation_sha }}
          path: .implementation
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.17.0'
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          python-version: '3.13'
          enable-cache: false
      - name: Install locked controller
        working-directory: .implementation
        run: uv sync --locked
      - name: Real ephemeral VM provisioning and deployment chain
        env:
          IMPLEMENTATION_SHA: ${{ inputs.implementation_sha }}
        run: |
          sudo env GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted GITHUB_RUN_ID="$GITHUB_RUN_ID" IMPLEMENTATION_SHA="$IMPLEMENTATION_SHA" \
            NODE_BOOTSTRAP_DIR="$(dirname "$(command -v node)")" \
            CONTROLLER_PYTHON="$PWD/.implementation/.venv/bin/python" \
            bash tests/integration/mastodon_release/run.sh
      - name: Capture diagnostic service state
        if: always()
        run: |
          sudo mkdir -p /var/tmp/mastodon-release-evidence
          sudo journalctl -u 'mastodon-*' --no-pager -n 150 > /tmp/mastodon-journal.txt
          sudo cp /tmp/mastodon-journal.txt /var/tmp/mastodon-release-evidence/journal.log
          sudo chmod -R a+rX /var/tmp/mastodon-release-evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: mastodon-release-linux-${{ github.run_id }}
          path: /var/tmp/mastodon-release-evidence
          if-no-files-found: error
          retention-days: 7
