name: Daybook shared notifier native

on:
  push:
    branches: [pyinfra-shared-notifier-20261031]
    paths:
      - '.github/workflows/daybook-shared-notifier-native.yml'
      - 'tests/integration/daybook_shared_notifier/**'
      - 'src/ops_deploy/**'
      - 'pyproject.toml'
      - 'uv.lock'
  workflow_dispatch:
    inputs:
      implementation_sha:
        description: Exact reviewed ops-deploy implementation commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: daybook-shared-notifier-native-${{ github.ref }}
  cancel-in-progress: false

jobs:
  owned-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      IMPLEMENTATION_SHA: ${{ inputs.implementation_sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.IMPLEMENTATION_SHA }}
          persist-credentials: false
      - name: Validate immutable implementation selection
        run: '[[ "$IMPLEMENTATION_SHA" =~ ^[0-9a-f]{40}$ ]]'
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          python-version: '3.13'
          enable-cache: false
      - name: Run fixed installer inside an owned disposable Linux container
        run: bash tests/integration/daybook_shared_notifier/run-container.sh
      - name: Make owned evidence readable
        if: always()
        run: sudo chmod -R a+rX "$RUNNER_TEMP/daybook-notifier-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: daybook-shared-notifier-${{ github.run_id }}
          path: ${{ runner.temp }}/daybook-notifier-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 7
