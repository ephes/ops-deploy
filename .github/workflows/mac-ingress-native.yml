name: Mac application ingress integration

on:
  workflow_dispatch:
    inputs:
      implementation_sha:
        description: Exact reviewed implementation commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mac-ingress-native-${{ github.ref }}
  cancel-in-progress: false

jobs:
  real-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validate immutable implementation selection
        env:
          IMPLEMENTATION_SHA: ${{ inputs.implementation_sha }}
        run: '[[ "$IMPLEMENTATION_SHA" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.implementation_sha }}
          path: .implementation
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          python-version: '3.13'
          enable-cache: false
      - name: Install immutable controller package
        working-directory: .implementation
        env:
          IMPLEMENTATION_SHA: ${{ inputs.implementation_sha }}
        run: |
          unset OPS_DEPLOY_PATH OPS_LIBRARY_PATH VIRTUAL_ENV
          uv sync --locked
          uv pip install --python .venv/bin/python --no-deps --reinstall "ops-deploy @ git+https://github.com/ephes/ops-deploy.git@$IMPLEMENTATION_SHA"
      - name: Real owned Linux ingress convergence
        env:
          IMPLEMENTATION_SHA: ${{ inputs.implementation_sha }}
        run: |
          sudo env GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted IMPLEMENTATION_SHA="$IMPLEMENTATION_SHA" \
            IMPLEMENTATION_ROOT="$PWD/.implementation" \
            "$PWD/.implementation/.venv/bin/python" "$PWD/.implementation/tests/integration/mac_ingress/harness.py"
      - name: Make evidence readable
        if: always()
        run: sudo chmod -R a+rX /var/tmp/mac-ingress-evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mac-ingress-linux-${{ github.run_id }}
          path: /var/tmp/mac-ingress-evidence
          if-no-files-found: error
          retention-days: 7
