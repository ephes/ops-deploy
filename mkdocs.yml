site_name: ops-deploy
site_description: Typed pyinfra deploys for self-hosted services
repo_url: https://github.com/ephes/ops-deploy
theme:
  name: material
  features:
    - content.code.copy
markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - tables
nav:
  - Home: index.md
  - Development: development.md
  - Concepts:
      - Service configuration: concepts/config.md
      - Secrets: concepts/secrets.md
      - Operations: concepts/operations.md
      - Git source: concepts/git-source.md
      - Deploy helpers: concepts/helpers.md
      - Testing deploys: concepts/testing.md
      - Smoke target: concepts/smoke.md
  - Base deploys: base.md
  - PostgreSQL and Redis: infra.md
  - Traefik: traefik.md
  - Services:
      - toy: services/toy.md
      - toyweb: services/toyweb.md
      - nyxmon: services/nyxmon.md
      - nyxmon_site_checks: services/nyxmon_site_checks.md
      - fastdeploy: services/fastdeploy.md
      - archive: services/archive.md
      - chesslab: services/chesslab.md
      - delve: services/delve.md
      - recorder: services/recorder.md
      - static_site: services/static_site.md
      - django_site: services/django_site.md
      - compose_app: services/compose_app.md
      - livekit: services/livekit.md
      - native_app: services/native_app.md
      - shared_tree: services/shared_tree.md
      - opaq_app: services/opaq_app.md
      - weeknotes_home: services/weeknotes_home.md
      - echoport: services/echoport.md
      - logyard: services/logyard.md
      - graphyard: services/graphyard.md
      - work_app: services/work_app.md
      - zellij_ingress: services/zellij_ingress.md
      - homelab: services/homelab.md
      - thermal_monitoring: services/thermal_monitoring.md
      - jellyfin: services/jellyfin.md
  - Changelog: changelog.md
