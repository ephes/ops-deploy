site_name: ops-deploy
site_description: Typed pyinfra deploys for self-hosted services
repo_url: https://github.com/ephes/ops-deploy
theme:
  name: material
  features:
    - content.code.copy
markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - tables
nav:
  - Home: index.md
  - Development: development.md
  - Concepts:
      - Service configuration: concepts/config.md
      - Secrets: concepts/secrets.md
      - Operations: concepts/operations.md
      - Deploy helpers: concepts/helpers.md
      - Testing deploys: concepts/testing.md
      - Smoke target: concepts/smoke.md
  - Base deploys: base.md
  - PostgreSQL and Redis: infra.md
  - Traefik: traefik.md
  - Services:
      - toy: services/toy.md
      - toyweb: services/toyweb.md
      - nyxmon: services/nyxmon.md
      - fastdeploy: services/fastdeploy.md
      - archive: services/archive.md
      - chesslab: services/chesslab.md
      - delve: services/delve.md
  - Changelog: changelog.md
