site_name: ops-deploy
site_description: Typed pyinfra deploys for self-hosted services
repo_url: https://github.com/ephes/ops-deploy
theme:
  name: material
  features:
    - content.code.copy
markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - tables
